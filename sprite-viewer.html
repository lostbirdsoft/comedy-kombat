<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comedy Kombat — перегляд спрайтів</title>
<style>
body{margin:0;background:#14141c;color:#e5e7eb;font:14px/1.4 system-ui,sans-serif;padding:14px}
h1{font-size:18px;margin:0 0 8px}h2{font-size:15px;margin:22px 0 8px;color:#fbbf24}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
input,button,select{background:#262634;color:#fff;border:1px solid #444;border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}.sum{color:#a3e635}.warn{color:#fca5a5}.muted{color:#9ca3af}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.card{width:200px;background:#1d1d29;border:1px solid #333;border-radius:8px;padding:6px;text-align:center}
.card.miss{border-style:dashed;opacity:.55}
.card canvas{width:192px;height:144px;background:repeating-conic-gradient(#2b2b3a 0 25%,#222230 0 50%) 0 0/16px 16px;border-radius:4px}
.card b{display:block;font-size:12px}.card small{display:block;color:#9ca3af;font-size:11px;min-height:28px}
.t1{color:#fbbf24}.t2{color:#7dd3fc}.t3{color:#9ca3af}
</style></head><body>
<h1>Перегляд спрайтів бійця</h1>
<div class="bar">
  <label>id бійця: <input id="fid" value="" placeholder="напр. ostap" size="16"></label>
  <button id="go">Показати</button>
  <label><input type="checkbox" id="flip"> дзеркало (дивиться вліво)</label>
  <label><input type="checkbox" id="guide" checked> лінії: підлога і точка опори</label>
  <label>швидкість <select id="spd"><option value="1">×1</option><option value="0.5">×0.5</option><option value="0">пауза</option></select></label>
</div>
<div id="sum" class="sum"></div><div id="msg" class="warn"></div><div id="out"></div>
<script type="module" src="sprite-viewer.js?v=47599964"></script></body></html>
